# A1WJUN-KBD47 用户配置

# ============================================================================
#  基础与核心功能
# ============================================================================
CONFIG_ZMK_KEYBOARD_NAME="A1WJUN-KBD47"
CONFIG_BT_DEVICE_NAME="A1WJUN-KBD47"
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

# ZMK Studio 支持（解锁后可在线配置，保持锁定以防误操作）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ============================================================================
#  HID 与系统行为（稳定优先）
# ============================================================================
# 使用 Boot Keyboard (6KRO) 模式，兼容 BIOS/UEFI 及老旧系统，不启用 NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=n

# 关闭 HID 指示灯，节省电量（若无实体 LED 或屏幕显示需求）
CONFIG_ZMK_HID_INDICATORS=n

# ============================================================================
#  蓝牙与连接（稳定优先，兼顾低延迟）
# ============================================================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# 发射功率 +4 dBm，信号强且功耗可控
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 同时启用实验性连接功能和实验性安全功能（含 CONN + SEC）
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 优先使用 1M PHY（更省电、更稳定），关闭 2M PHY 和 Coded PHY
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n

# 低延迟连接间隔（15–25ms），打字跟手
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20

# 允许主机延迟响应，节省电量
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2

# 解决 Windows 下 GATT 订阅导致的断连问题
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 设备外观：键盘（0x03C1 = 961）
CONFIG_BT_DEVICE_APPEARANCE=961

# ============================================================================
#  安全
# ============================================================================
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y

# ============================================================================
#  电池服务
# ============================================================================
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
# 电池上报间隔 60 秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ============================================================================
#  指向 / 鼠标
# ============================================================================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ============================================================================
#  电源管理（续航与响应的最佳平衡）
# ============================================================================
# 启用深度睡眠支持
CONFIG_ZMK_SLEEP=y

# 空闲超时：60 秒
CONFIG_ZMK_IDLE_TIMEOUT=60000

# 睡眠超时：5 分钟（进入深度睡眠，最大限度省电）
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# 启用软关机功能
CONFIG_ZMK_PM_SOFT_OFF=y

# 禁用 DCDC 高压模式，降低功耗
CONFIG_BOARD_ENABLE_DCDC_HV=n

# ============================================================================
#  性能与资源
# ============================================================================
# 关闭调试日志，降低 CPU 开销
CONFIG_ZMK_LOG_LEVEL_DBG=n

# ============================================================================
#  编码器
# ============================================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================================
#  高级调优（提升打字体验）
# ============================================================================
# 去抖优化：兼顾响应速度与稳定性
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3
