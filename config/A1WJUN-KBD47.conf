# ============================================================================
#  基础与核心功能
# ============================================================================
CONFIG_BT_DIS_MANUF_NAME_STR="A1WJUN"
CONFIG_BT_DIS_MODEL_NUMBER_STR="KBD47"

CONFIG_ZMK_KEYBOARD_NAME="A1WJUN KBD47"
# 解锁蓝牙ID字符16 理论最大为248字符
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=10

# ZMK Studio 支持（解锁后可在线配置，保持锁定以防误操作）
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# ============================================================================
#  HID 与系统行为（稳定优先）
# ============================================================================
# 使用 Boot Keyboard (6KRO) 模式，兼容 BIOS/UEFI 及老旧系统
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=n

# 关闭 HID 指示灯，节省电量
CONFIG_ZMK_HID_INDICATORS=n

# ============================================================================
#  鼠标仿真（性能优先）
# ============================================================================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ============================================================================
#  蓝牙与连接（稳定优先，兼顾低延迟）
# ============================================================================
# 发射功率 +4 dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# 实验性功能
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# 1M PHY（省电稳定）
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_PHY_CODED=n

# 低延迟连接间隔
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=20

# 允许主机延迟响应（优化：2 → 4，更省电）
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4

# 解决 Windows 断连问题
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 电池服务
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
# 电池上报间隔 120 秒（可根据使用场景调整：60/120/180/300）
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120

# Device Information Service
CONFIG_BT_DIS=y

# ============================================================================
#  电源管理（续航优化）
# ============================================================================
CONFIG_ZMK_SLEEP=y

# 空闲超时：60 秒
CONFIG_ZMK_IDLE_TIMEOUT=60000

# 睡眠超时：3 分钟
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=180000

# 软关机
CONFIG_ZMK_PM_SOFT_OFF=y

# ============================================================================
#  性能与资源
# ============================================================================
CONFIG_ZMK_LOG_LEVEL_DBG=n

# 连接数限制
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# ============================================================================
#  编码器
# ============================================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================================
#  高级调优（优化版）
# ============================================================================
# 去抖优化：2ms（更快响应，适合机械轴）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=2
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=2
